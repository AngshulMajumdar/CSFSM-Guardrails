[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "csfsm-guardrails"
version = "0.1.0"
description = "Conversational stochastic finite-state guardrails for responses and tool execution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Angshul Majumdar"}]
dependencies = ["numpy>=1.26,<3", "pydantic>=2.7,<3", "PyYAML>=6,<7"]
keywords = ["guardrails", "finite-state-machine", "llm", "safety", "conversation"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
client = ["httpx>=0.27,<1"]
space = ["gradio>=6,<7"]
langchain = ["langchain-core>=1,<2"]
langgraph = ["langgraph>=1,<2", "langchain-core>=1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.11", "build>=1", "httpx>=0.27,<1"]

[project.scripts]
csfsm = "csfsm_guardrails.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/csfsm_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

