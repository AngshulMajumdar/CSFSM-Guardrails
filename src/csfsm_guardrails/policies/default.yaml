name: conversational-guardrail
version: '1.0'
states: [routine, uncertain, restricted, probing]
observations: [routine, ambiguous, restricted, probing, unknown, neutral]
prior: [0.94, 0.04, 0.015, 0.005]
transitions:
  default:
    - [0.94, 0.035, 0.015, 0.01]
    - [0.20, 0.70, 0.06, 0.04]
    - [0.06, 0.04, 0.85, 0.05]
    - [0.025, 0.025, 0.10, 0.85]
emissions:
  - [0.84, 0.06, 0.01, 0.005, 0.035, 0.05]
  - [0.20, 0.60, 0.04, 0.015, 0.095, 0.05]
  - [0.08, 0.06, 0.72, 0.04, 0.05, 0.05]
  - [0.04, 0.04, 0.12, 0.70, 0.05, 0.05]
actions:
  - name: allow_input
    stages: [input]
    utility: [6, 1, -4, -7]
    risk: [0, 0.01, 0.85, 0.95]
  - name: release
    stages: [output]
    utility: [6, 1, -6, -7]
    risk: [0, 0.02, 0.95, 0.98]
  - name: execute_tool
    stages: [tool]
    utility: [7, 0, -6, -8]
    risk: [0, 0.03, 0.95, 0.99]
  - name: clarify
    stages: [input, output, tool]
    utility: [-2, 5, 0, -2]
    risk: [0, 0, 0, 0]
    message: Please clarify the intended request before continuing.
  - name: request_verification
    stages: [input, output, tool]
    utility: [-3, -2, -3, -3]
    risk: [0, 0, 0, 0]
    message: Verification and permission for this exact operation are required.
  - name: refuse
    stages: [input, output, tool]
    utility: [-5, -3, 6, 7]
    risk: [0, 0, 0, 0]
    message: This request cannot be released under the configured policy.
  - name: stop
    stages: [input, output, tool]
    utility: [-10, -9, -4, -3]
    risk: [0, 0, 0, 0]
    message: This guardrail session has stopped. Start a new authorized session to continue.
protocol_rules:
  - {event: verified, target: verified}
  - {event: revoked, target: unverified}
patterns:
  - code: instruction_override
    pattern: '(?is)\b(?:ignore|disregard|override)\b.{0,60}\b(?:instructions|guardrails|rules|policy)\b'
    stages: [input, tool]
  - code: system_prompt_extraction
    pattern: '(?is)\b(?:reveal|print|expose|dump)\b.{0,40}\b(?:system prompt|hidden instructions)\b'
    stages: [input, output, tool]
  - code: secret_marker
    pattern: 'CSFSM_DEMO_SECRET'
    stages: [output, tool]
  - code: credential_assignment
    pattern: '(?i)\b(?:api[_ -]?key|password|access[_ -]?token)["'']?\s*[:=]\s*["'']?[A-Za-z0-9_/-]{8,}'
    stages: [output, tool]
tools:
  lookup_record: {requires_grant: true, requires_verification: true}
temperature: 0.7
risk_threshold: 0.20
uncertainty_radius: 0.02
selection: max
risk_semantics: model_score
max_decisions: 100
max_clarifications: 3
session_ttl_seconds: 3600

