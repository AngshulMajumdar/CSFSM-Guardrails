services:
  guardrail:
    build: .
    ports:
      - '8000:8000'
    env_file: .env
    volumes:
      - sessions:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sessions:
